# Uptime checks and the nightly shop backup (homelab/ in stixnvibes-nv).
- id: uptime
  name: Uptime
  description: Uptime Kuma, alerts when a tool or the shop goes down
  icon: "📈"
  group: Home lab
  tier: core
  url: http://${HOME_LAB_HOST:-localhost}:3001
  health: http://${HEALTH_HOST:-localhost}:3001/api/entry-page

# Start, stop and logs for any container live in Portainer, which already runs on the home lab.
# It uses a self-signed https certificate, so it opens in its own tab and is not health-checked.
- id: portainer
  name: Containers
  description: Start, stop and read logs of every container (Portainer)
  icon: "🐳"
  group: Home lab
  tier: base
  url: https://${HOME_LAB_HOST:-localhost}:9999
  embed: false
