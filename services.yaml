  icon: "🛠️"
  group: Studio tools
  tier: base
  url: http://${HOME_LAB_HOST:-localhost}:8304
  health: http://${HEALTH_HOST:-localhost}:8304/health.json
  expect: '"ok"'

- id: cricut
  name: Cricut sheets
