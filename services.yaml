# Every tool the control room shows. One entry per tool.
#
#   id           short unique name, lowercase with dashes
#   name         shown on the icon and window title
#   description  one line under the name
#   icon         an emoji
#   group        section on the desktop
#   tier         base (always on) | core (business) | heavy (on demand) | cloud (hosted elsewhere, watch only)
#   url          what your BROWSER opens (a window or a tab)
#   health       what the SERVER checks every 15 s; may be a Docker-internal address. Leave out for "not checked".
#   expect       optional text the health reply must contain
#   embed        false = open in a browser tab instead of a window (for sites that forbid embedding)
#
# ${NAME:-default} is filled from the environment, so the same file works on any machine.

- id: shop
  name: Shop
  description: shop.stixnvibes.com, orders and checkout
  icon: "🛍️"
  group: Stix N Vibes
  tier: cloud
  url: https://shop.stixnvibes.com
  health: https://shop.stixnvibes.com/api/health
  expect: '"ok":true'
  # The shop sends X-Frame-Options: DENY (it stops other sites framing the
  # checkout and admin), so it opens in its own tab.
  embed: false

- id: admin
  name: Shop admin
  description: Orders, products, stalls, reviews (the Android app uses the same data)
  icon: "🧾"
  group: Stix N Vibes
  tier: cloud
  url: https://shop.stixnvibes.com/admin
  health: https://shop.stixnvibes.com/api/health
  expect: '"ok":true'
  embed: false

- id: landing
  name: Website
  description: www.stixnvibes.com landing page
  icon: "🌐"
  group: Stix N Vibes
  tier: cloud
  url: https://www.stixnvibes.com
  health: https://www.stixnvibes.com

- id: inwoice
  name: InWoice
  description: Invoices, synced from shop orders
  icon: "📄"
  group: Business
  tier: core
  url: http://${HOME_LAB_HOST:-localhost}:5000
  health: http://${HEALTH_HOST:-localhost}:5000/health
  expect: '"database":"ok"'

- id: receipts
