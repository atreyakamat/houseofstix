# The control room. Normally started by deploy/stixctl, which also supplies the env file.
#   by hand: STIX_HUB_ENV=.env docker compose up -d --build   (or just cp .env.example .env first)
services:
  houseofstix:
    build: .
    restart: unless-stopped
    env_file: ${STIX_HUB_ENV:-.env}
    environment:
      # Inside the container "localhost" is the container itself, so health checks
      # reach the other tools through the host.
      HEALTH_HOST: host.docker.internal
      # Tools set to "no" in stack.conf show as Off and never alert.
      STACK_FILE: /app/stack.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # HUB_BIND limits which network the control room listens on. Set it to the
      # home lab's LAN or Tailscale address (e.g. 100.x.y.z) so it can never be
      # reached through any other interface. Never forward this port on the router.
      - "${HUB_BIND:-0.0.0.0}:8200:8200"
    volumes:
      # Edit services.yaml on the host and restart to change the tool list.
      - ./services.yaml:/app/services.yaml:ro
      - ./deploy/stack.conf:/app/stack.conf:ro
    mem_limit: 192m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
