# Every tool the Linux home lab runs, one per line. stixctl reads this file.
#
#   id         short name; the Docker Compose project is "stix-<id>"
#   tier       base = always on at boot | core = business, on at boot | heavy = start when needed
#   enabled    yes | no   (a "no" tool is never cloned, built or started)
#   repo       GitHub address; "self" for this repository; or "external:<container>" for a
#              container that already runs on this machine and is NOT built or changed here
#   compose    the compose file inside that repository ("-" for external)
#
# Change "yes" to "no" to turn a tool off for good. Nothing is deleted.
#
# id         tier   enabled  repo                                                    compose
hub          base   yes      self                                                    docker-compose.yml
cricut       base   yes      https://github.com/atreyakamat/cricut                   docker-compose.yml
renamex      base   yes      https://github.com/atreyakamat/ReNameX                  docker-compose.yml
inwoice      core   yes      https://github.com/atreyakamat/InWoice                  docker-compose.yml
bgremover    heavy  yes      https://github.com/atreyakamat/Stix-Sticker-Maker       docker-compose.yml
# Already running on the home lab (atreya7/scaleup, port 7756). stixctl only starts, stops and checks it.
scaleup      heavy  yes      external:scaleup                                        -
# Off until its web page is served by its server (see deploy/README.md, "Receipt maker").
receipts     heavy  no       https://github.com/atreyakamat/invoice-receipt-maker    docker-compose.production.yml
