# Ports on the home lab that already belong to something. The CI contract test
# fails if a Stix tool is given one of these ports, and "stixctl doctor" warns
# if the owner is not what is listening there.
#
#   port   owner      what it is
#   owner is a services.yaml id when the control room shows that program (it
#   may then use the port), or "-" when only something else may use it.
#
# Add a line whenever you install something new on the box.
3000   -          AdGuard Home (DNS dashboard)
8080   -          Filebrowser
7575   -          Homarr
9000   -          SonarQube
8069   -          Odoo
5678   -          n8n
9999   portainer  Portainer
7756   scaleup    ScaleUp (existing container)
8200   hub        House of Stix control room
